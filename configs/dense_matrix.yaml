# configs/dense_matrix.yaml — TASK-09 dense prediction toward GATE 2
# ===================================================================
# Six runs: COCO detection and ADE20K segmentation x {baseline, saga,
# registers}, all on the SEEDED e2r ViT-B mixup s1 backbones.
#
# Consumed by detection/tools/train.py, segmentation/tools/train.py
# (--matrix ... --run <run_id>) and scripts/gen_dense_jobs.py.
#
# HYPERPARAMETERS ARE NOT RESTATED HERE. Each run resolves onto the
# COMMITTED task config named in `task_configs` (detection/configs/base.yaml,
# segmentation/configs/base.yaml) and only the variant switches (gate /
# registers) are merged in — the "legacy 1x schedule, hyperparameters as
# committed" requirement is therefore verifiable by reading those two files,
# and tests/test_task09_dense.py pins the resolved values against them.
# `warmup_epochs` appears in both base configs but the committed trainers
# never implemented warmup; it stays unimplemented (adding it would change
# the schedule, i.e. the numbers).
#
# run_id = <det|seg>_vitb_<variant>_s<N>.
# NAMING, and the one place it is not uniform (recorded rather than
# silently reconciled): for the six s1 runs the suffix denotes the
# BACKBONE's e2r seed, which is 1 for every ViT-B backbone that exists. For
# the two det_*_s2 runs added in Phase C it denotes the DENSE TRAINER's
# seed — same backbone file, byte for byte. Both readings coincide on the
# only thing that matters, because the authority is never the name: every
# run records `seed` and `backbone_run`/`backbone_sha256` in meta.json and
# in every results JSON, and the tables pair on those.

task_configs:
  detection: detection/configs/base.yaml
  segmentation: segmentation/configs/base.yaml

out_roots:
  detection: results/detection
  segmentation: results/segmentation

n_register_tokens: 4

# Where ckpt/ goes. null = the run dir, i.e. CODE_ROOT on the `hpc`
# filesystem, which How to Run.md §1 reserves for CODE ONLY and which
# measured 101G of a 100G soft quota (in grace) on 2026-09-08. Each
# detection run writes ~1.16 GiB and each segmentation run ~1.37 GiB
# (last.pth + weights-only best_model.pth), and the SMOKES write the same,
# so the six chains plus smokes are ~10 GiB on a filesystem that is already
# over its limit. Set this to a bulk path and scripts/gen_dense_jobs.py adds
# `--ckpt_root <path>` to all six chains AND both smokes; the trainers then
# put ckpt/ under <ckpt_root>/<run_id>/ and record `ckpt_dir` in meta.json.
# Regenerate after changing it:  python scripts/gen_dense_jobs.py
# Chosen 2026-09-08 from the repo's own evidence, not invented: How to Run.md
# §1 designates /home/woody/iwi5/iwi5359h as the BULK/working filesystem
# (~1 T soft), it is where the committed COCO/ADE20K/CUB/Aircraft archives
# already live (so it is demonstrably mounted on the compute nodes — the
# 2026-09-08 smokes read their datasets from it), and the quota output that
# day showed it at 226G of 954G (~728 G free) while hpc was at 101G of 100G
# and vault at 974G of 1000G. Checkpoints are a handful of large files, so
# vault's ~200K file limit is irrelevant here but its ~26 G of space
# headroom is; woody has room for the ~10 GiB these runs write. The tmp file
# atomic_torch_save renames sits in the same directory, so the rename stays
# atomic.
ckpt_root: /home/woody/iwi5/iwi5359h/SAGA/dense_ckpt

# ADE20K class names for per_class_iou.csv's `name` column (Phase C surfaces
# the sky/wall/floor rows by name). The 2026-09-08 smoke found the committed
# ADEChallengeData2016.zip extracts WITHOUT objectInfo150.csv, so the names
# came out MISSING; the class INDICES and every number are unaffected.
# Set this to a real objectInfo150.csv on the HPC (absolute, or repo-relative
# if the file is committed) and the names resolve; leave it null and the
# trainer searches the staged tree and reports which paths it tried.
class_names_file: null

# Extra eval knobs the committed base configs do not carry. Multi-scale is
# TTA on the 512x512 val tensor the committed val pipeline produces (that
# pipeline resizes every val image to 512x512), NOT whole-image multi-scale
# testing — miou_ms.json records the scales so the distinction is on record.
common_overrides:
  eval:
    ms_scales: [0.5, 0.75, 1.0, 1.25, 1.5]
    ms_flip: true

# SLURM chain lengths (24 h walltime each). Detection is ~2.5-3 days per
# backbone at 25 epochs, segmentation ~15 h; every job runs the SAME
# `--resume auto` command, so a surplus job exits in seconds.
chain:
  detection: 4
  segmentation: 2

backbones:
  # ── baseline / saga: the seeded e2r ViT-B mixup s1 runs. sha256 values are
  # copied from the committed results/runs/<run>/eval/imagenet_val_last.json
  # and cross-checked by tests/test_task09_dense.py; the trainer refuses a
  # backbone file whose hash does not match.
  vitb_baseline:
    run: e2r_vitb_mixup_baseline_s1
    ckpt: results/runs/e2r_vitb_mixup_baseline_s1/ckpt/last.pth
    sha256: 316211c719c41113c1f9bffa7f500e158d727c0f0998e41869796209a3fd1339
  vitb_saga:
    run: e2r_vitb_mixup_saga_s1
    ckpt: results/runs/e2r_vitb_mixup_saga_s1/ckpt/last.pth
    sha256: a4e0e0ccd3b4cd4d40b9f46417d602d8eed4913a29b36f5b3bce78e1dfe77229
  # ── registers: per TASK-09, the seeded e2r ViT-B registers run IF it has
  # FINISHED by launch time, ELSE the legacy ViT-B registers checkpoint. As
  # of 2026-09-08 that e2r run has never been submitted (its smoke is still
  # blocked, see docs/TASK_LOG.md), so the fallback is what will be used.
  # `resolve_backbone()` records which one won as
  # `backbone_source: primary|fallback` in meta.json and in every results
  # JSON, and it accepts the primary ONLY when that run is complete
  # (require_complete/require_epochs below: the e2r trainer rewrites
  # last.pth every epoch, so file existence alone would hand the dense runs
  # a mid-training checkpoint) AND its sha256 is pinned here.
  # TO SWITCH TO THE e2r REGISTERS BACKBONE: once that run finishes, copy
  # its ckpt_sha256 out of
  # results/runs/e2r_vitb_mixup_registers_s1/eval/imagenet_val_last.json
  # into `sha256` below. Until then every rejection reason is printed and
  # the fallback is used.
  vitb_registers:
    run: e2r_vitb_mixup_registers_s1
    ckpt: results/runs/e2r_vitb_mixup_registers_s1/ckpt/last.pth
    sha256: null
    require_complete: results/runs/e2r_vitb_mixup_registers_s1
    require_epochs: 300     # classification/configs/base.yaml train.epochs
    fallback:
      run: legacy_e2_vitb_registers_nomixdir
      ckpt: /home/vault/iwi5/iwi5359h/SAGA/e2/checkpoints/ViT-B_registers_nomix/last.pth
      sha256: 82365a311187250c34965c93a13ab435adf7ac2ad655115c855f7708f6f8ddb1
      note: >-
        legacy e2 ViT-B registers, "nomix" DIRECTORY but recipe_actual=mixup
        (results/notes/recipe_erratum.md — the legacy nomix config never
        applied its augmentation block, so this checkpoint was trained with
        mixup 0.8 / cutmix 1.0, matching the baseline/saga backbones' recipe).
        Path and sha256 are row
        /home/vault/.../e2/checkpoints/ViT-B_registers_nomix/last.pth of
        results/legacy/checkpoint_manifest.csv. UNSEEDED (seed "rlast"), so
        the registers rows are one repeat with no seed control.

# Each run PINS its master port here. The generator used to derive ports
# from the sorted index, which meant adding a run renumbered every run after
# it alphabetically — including ones that had already produced results, so
# the committed job file would no longer match what ran. Ports must stay
# disjoint from every other committed launcher (the smokes hold 29860/29861;
# tests/test_task09_dense.py re-derives the full occupied table from the
# repo, array-computed bases included).
runs:
  det_vitb_baseline_s1:  {task: detection, arch: vit_base_patch16_224, variant: baseline, backbone: vitb_baseline, seed: 1, port: 29850}
  det_vitb_saga_s1:      {task: detection, arch: vit_base_patch16_224, variant: saga, backbone: vitb_saga, seed: 1, port: 29852}
  det_vitb_registers_s1: {task: detection, arch: vit_base_patch16_224, variant: registers, backbone: vitb_registers, seed: 1, port: 29851}
  seg_vitb_baseline_s1:  {task: segmentation, arch: vit_base_patch16_224, variant: baseline, backbone: vitb_baseline, seed: 1, port: 29853}
  seg_vitb_saga_s1:      {task: segmentation, arch: vit_base_patch16_224, variant: saga, backbone: vitb_saga, seed: 1, port: 29855}
  seg_vitb_registers_s1: {task: segmentation, arch: vit_base_patch16_224, variant: registers, backbone: vitb_registers, seed: 1, port: 29854}

  # ── TASK-09 Phase C: a SECOND DETECTION SEED, prepared, NOT submitted ──
  # The Gate-2 verdict turns on AP_S(saga) - AP_S(baseline) = -0.844, which
  # is a single draw whose magnitude sits inside the within-run epoch-to-
  # epoch spread of AP_S (0.394-0.759 over the last three evals; see
  # results/notes/gate2_report.md section 5). These two runs give that delta
  # its first repeat.
  #
  # NAMING (reconciliation): everywhere above, the `_s1` suffix denotes the
  # BACKBONE's e2r seed. For these two it denotes the DENSE TRAINER's seed —
  # the backbone is the SAME e2r mixup s1 checkpoint, byte for byte, as the
  # s1 runs (same `backbone:` key, so the same pinned sha256). What differs
  # is `seed: 2`, which changes the detection head init, the
  # DistributedSampler order and the augmentation stream, and nothing else.
  # Each run records its backbone in meta.json (`backbone_run`,
  # `backbone_sha256`), so the pairing is never inferred from the name.
  # No registers s2 and no segmentation s2: the human asked for the
  # detection baseline/saga pair only.
  # `submitted: false` — the launchers exist and are tested, but the human
  # decided on 2026-09-13 NOT to run them. The flag is what keeps these two
  # OUT of the Gate-2 tables: without it they appear as MISSING rows, which
  # reads as "a run failed or is pending" rather than "was never started".
  # A run that IS expected and whose artifact is absent still yields MISSING
  # — that guard is untouched. Flip this to true if they are ever submitted.
  det_vitb_baseline_s2:  {task: detection, arch: vit_base_patch16_224, variant: baseline, backbone: vitb_baseline, seed: 2, port: 29856, submitted: false}
  det_vitb_saga_s2:      {task: detection, arch: vit_base_patch16_224, variant: saga, backbone: vitb_saga, seed: 2, port: 29857, submitted: false}

# Test-time-registers dense rows (registers bolted onto a trained
# baseline/SAGA at inference) are a LATER task — noted here, not built.
