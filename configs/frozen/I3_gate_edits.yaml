    diag: false
  - id: dihedral4_L7          # rot180
    edit_type: gate_edit
    params: {layer: 7, mode: dihedral, perm: 4}
    applies_to: [saga]
    diag: false
  - id: dihedral5_L7          # rot180_flip_lr
