    applies_to: [saga]
    diag: false
  # ---- block 8 (0-based) = paper block 9 ----------------------------------------
  # mu_h at every position: the arrangement removed entirely, the
  # per-head mean kept. C1 is this minus `original`.
  - id: mean_L8
    edit_type: gate_edit
    params: {layer: 8, mode: mean}
    applies_to: [saga]
    stages: [s11_out]
    diag: true
  # mu_h + 0.5 * delta_h(p): half the arrangement. LOCKED_ANALYSIS
  # section 3 item 3 fixes alpha = 0.5; it is not a swept knob.
  - id: mean_half_L8
    edit_type: gate_edit
    params: {layer: 8, mode: mean_plus_alpha_delta, alpha: 0.5}
    applies_to: [saga]
    diag: false
  # The 10 fixed POSITION permutations, shared across heads, read
