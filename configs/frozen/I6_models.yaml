# configs/frozen/I6_models.yaml — TASK A / I6's external public checkpoints,
# and THE PRE-REGISTERED PREDICTION
# =============================================================================
# I6 asks whether public models we did not train show the same spatial
# structure, and whether its presence follows the training recipe the way our
# own controlled cell suggests.
#
# THE PREDICTION BELOW WAS WRITTEN BEFORE ANY EXTERNAL FORWARD PASS. That is
# the whole point of this file: it is committed, in git, with a date, before
# the download tool has fetched a single weight. `prediction` is copied
# VERBATIM out of docs/TASK_A_I1_I6.md §9 — tests/test_I6_external.py asserts
# the two strings are equal character for character, so it cannot be edited
# after the fact to match an outcome.
#
# EITHER OUTCOME IS REPORTED. `analysis/frozen_I6_external.py` computes
# `prediction_outcome` per model BY CODE from the registered `group` and the
# measured ring profile. No human types "met" into a table.

work_package: I6_external
registered_at: "2026-09-17"
prediction_source: "docs/TASK_A_I1_I6.md §9"

# Copied verbatim. Note the non-breaking hyphens (U+2011); they are part of
# the string the test compares.
prediction: >-
  Supervised ImageNet‑1k models whose recipe includes MixUp and CutMix
  (DeiT‑S, DeiT3‑S, DeiT3‑B, AugReg ViT‑B/16) will show, at the
  second‑to‑last block output and at the last block output, a prevalence map
  with positive concentration excess and a ring profile peaking at ring 1
  rather than ring 0. Models trained without mixing (DINOv2‑S/B, OpenCLIP
  ViT‑B/16, MAE ViT‑B/16 encoder) will not show a ring‑1 peak, whatever other
  structure they show. Register variants (DINOv2 reg4) are exploratory and
  make no prediction. Either outcome is reported.

# ── How the prediction is scored, declared with it ───────────────────────────
# `ring_1_peak` is true when the 7- or 8-ring border profile of the map
# attains its maximum at ring 1. `concentration_excess_positive` is true when
# the Gini excess over the finite-sample null at that map's own mass is > 0.
#
#   supervised_mixing       met     <=> ring_1_peak AND concentration excess > 0
#   no_mixing               met     <=> NOT ring_1_peak
#   registers_exploratory   always  "not applicable" — no prediction was made
#
# A model is scored at BOTH analog stages and the two outcomes are reported
# separately; nothing is pooled across models or across groups.
outcome_rule:
  supervised_mixing: "met if ring_1_peak and gini_excess > 0"
  no_mixing: "met if not ring_1_peak"
  registers_exploratory: "not applicable — exploratory, no prediction"

# ── Run configuration ────────────────────────────────────────────────────────
# 224 for every model, so the grids are 14x14 (patch 16) or 16x16 (patch 14)
# and the ring geometry is defined. THIS IS A DEVIATION for the three DINOv2
# models, whose pretrained input size is 518: timm interpolates the position
# embedding down to a 16x16 grid. It is recorded per model as
# `native_input_size` and it is stated in the note — a DINOv2 result here is
# a result about DINOv2 at 224, not about DINOv2 as published.
input_size: 224
precision: fp32

# Normalization is NEVER hard-coded: it comes from timm's own data config for
# the specific pretrained tag and is recorded per model in the output. The
# four recipes in this registry disagree (ImageNet mean/std, 0.5/0.5, CLIP's
# own, and crop_pct 1.0 for DINOv2), and applying our cohort's transform to a
# CLIP checkpoint would measure the mismatch rather than the model.
normalization: from_timm_data_config

# Where the weights are cached on the cluster. The download tool sets HF_HOME
# and TORCH_HOME to this before importing timm, so nothing lands in $HOME
# (which is the small quota — How to Run.md §3). Override with SAGA_HF_HOME.
#
# The ROOT /home/woody/iwi5/iwi5359h/SAGA is the repo's documented bulk path
# (How to Run.md §3; scripts/jobs/*.sbatch use ckpt_root, dense_ckpt,
# probe_attn under it). `hf_cache` follows that naming.
hf_home: /home/woody/iwi5/iwi5359h/SAGA/hf_cache

# Thresholds: the canon recipe (median over images of the per-image
# median + 5*MAD) run per model and per stage on the CALIBRATION split, then
# APPLIED to the evaluation split.
#
# This differs from I1/I2 on purpose and the difference is recorded in the
# file itself. There, tau_cal belongs to the split it was calibrated on,
# because it comes from a cell's designated BASELINE and is applied to that
# cell's other members on the same split. Here a public checkpoint is its own
# reference — there is no baseline to borrow a threshold from — so calibrating
# on `calibration` and reporting on `evaluation` is what keeps the threshold
# and the reported map off the same images.
thresholds_cal: results/frozen/I6_external/thresholds_cal.json
threshold_split: calibration
reporting_split: evaluation
mad_k: 5.0

bootstrap_seed: 0
bootstrap_resamples: 10000

# ── The nine models ──────────────────────────────────────────────────────────
# `mixing` is QUOTED: bare yes/no are booleans in YAML and this is a recipe
# label that gets printed into a table.
