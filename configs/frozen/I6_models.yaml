# A name that does not resolve in the installed timm is recorded UNAVAILABLE
# with the timm version and is NEVER substituted with a different checkpoint
# (TASK A §12). `weight_sha256: PENDING` is filled in by
# tools/frozen_I6_download.py on the login node, before any job runs.
